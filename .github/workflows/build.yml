name: Build APK

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-11-jdk python3-pip git

      - name: Install buildozer and dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Accept Android licenses and install build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;30.0.3" || true

      - name: Force Build Tools version in buildozer.spec
        run: |
          if grep -q "^android.build_tools_version" buildozer.spec; then
            sed -i 's/^android.build_tools_version = .*/android.build_tools_version = 30.0.3/' buildozer.spec
          else
            echo "android.build_tools_version = 30.0.3" >> buildozer.spec
          fi

      - name: Build APK using Buildozer
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroceryApp-APK
          path: bin/*.apk
