name: Build Kivy APK

on:
  push:
    branches:
      - main
      - test-branch

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/.android
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android
      ANDROID_NDK_VERSION: 25.2.9519653
      ANDROID_API_LEVEL: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (Ubuntu 24.04 compatible)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip git build-essential ccache libtool \
            autoconf automake libstdc++6 zlib1g-dev openjdk-17-jdk

          # Workaround for libncurses5: manually install if needed
          wget http://archive.ubuntu.com/ubuntu/pool/main/n/ncurses/libncurses5_6.1-1ubuntu1.18.04_amd64.deb
          sudo dpkg -i libncurses5_6.1-1ubuntu1.18.04_amd64.deb

          python3 -m pip install --upgrade pip
          pip install buildozer cython
      

      - name: Install Android cmdline-tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d latest
          rm cmdline-tools.zip

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;30.0.3" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set environment variables
        run: |
          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
          echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
