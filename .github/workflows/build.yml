name: Build Kivy APK

on:
  push:
    branches:
      - main
      - test-branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install required system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libncurses6 libstdc++6

      - name: Download Android SDK Command-line Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest

      - name: Accept Android SDK licenses
        run: yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses

      - name: Install Android platform tools and build tools
        run: |
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Set environment variables for Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Show workspace contents
        run: |
          echo "== Root directory =="
          pwd
          echo "== Listing files =="
          ls -R

      - name: Install Python dependencies via Poetry
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Install Buildozer & Cython
        run: |
          pip install buildozer cython

      - name: Build APK
        run: |
          buildozer android debug
